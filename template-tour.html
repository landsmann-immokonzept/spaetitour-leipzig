<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sp&auml;titour Leipzig</title>
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════ */
:root {
  /* Colors */
  --black: #000000;
  --surface-0: #000000;
  --surface-1: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --separator: rgba(84, 84, 88, 0.65);
  --separator-opaque: #38383a;
  --label-primary: #ffffff;
  --label-secondary: rgba(235, 235, 245, 0.6);
  --label-tertiary: rgba(235, 235, 245, 0.3);
  --label-quaternary: rgba(235, 235, 245, 0.18);
  --accent: #fbbf24;
  --accent-dim: rgba(251, 191, 36, 0.15);
  --red: #ff453a;
  --green: #30d158;
  --blue: #0a84ff;
  --fill-primary: rgba(120, 120, 128, 0.36);
  --fill-secondary: rgba(120, 120, 128, 0.32);
  --fill-tertiary: rgba(120, 120, 128, 0.24);

  /* Mechanik badge colors */
  --mechanik-matze: #c4b5fd;
  --mechanik-just-one: #67e8f9;
  --mechanik-activity: #fca5a5;
  --mechanik-wer-bin-ich: #fdba74;
  --mechanik-challenge: #fbbf24;
  --mechanik-ranking: #86efac;
  --mechanik-stadt: #a5b4fc;

  /* Typography */
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
  --large-title: 700 34px/41px var(--font);
  --title-1: 700 28px/34px var(--font);
  --title-2: 700 22px/28px var(--font);
  --title-3: 600 20px/25px var(--font);
  --headline: 600 17px/22px var(--font);
  --body: 400 17px/22px var(--font);
  --callout: 400 16px/21px var(--font);
  --subheadline: 400 15px/20px var(--font);
  --footnote: 400 13px/18px var(--font);
  --caption-1: 400 12px/16px var(--font);
  --caption-2: 400 11px/13px var(--font);

  /* Spacing */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 20px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Safe areas */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);

  /* Shell heights */
  --nav-height: 44px;
  --tab-height: 49px;

  /* Easing */
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--black);
  color: var(--label-primary);
  font: var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-appearance: none;
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ═══════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════ */

/* Nav Bar */
.nav-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: calc(var(--nav-height) + var(--sat));
  padding-top: var(--sat);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--separator);
  transition: transform 0.3s var(--ease-out), opacity 0.3s var(--ease-out);
}

.nav-bar.hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}

.nav-bar__back {
  position: absolute;
  left: var(--spacing-md);
  display: flex;
  align-items: center;
  gap: 4px;
  font: var(--body);
  color: var(--accent);
}

.nav-bar__back svg {
  width: 12px;
  height: 20px;
}

.nav-bar__title {
  font: var(--headline);
  color: var(--label-primary);
  text-align: center;
  max-width: 60%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-bar__score {
  position: absolute;
  right: var(--spacing-md);
  display: flex;
  align-items: center;
  gap: 4px;
  font: var(--headline);
  color: var(--accent);
}

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: calc(var(--tab-height) + var(--sab));
  padding-bottom: var(--sab);
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--separator);
  transition: transform 0.3s var(--ease-out), opacity 0.3s var(--ease-out);
}

.tab-bar.hidden {
  transform: translateY(100%);
  opacity: 0;
  pointer-events: none;
}

.tab-bar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding-top: 6px;
  min-width: 64px;
  color: var(--label-secondary);
  transition: color 0.2s;
}

.tab-bar__item.active {
  color: var(--accent);
}

.tab-bar__item svg {
  width: 24px;
  height: 24px;
}

.tab-bar__item span {
  font: var(--caption-2);
}

/* Main Content */
.main {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  transition: padding 0.3s var(--ease-out);
}

.main.with-nav {
  padding-top: calc(var(--nav-height) + var(--sat));
}

.main.with-tab {
  padding-bottom: calc(var(--tab-height) + var(--sab));
}

/* Screens */
.screen {
  display: none;
  min-height: 100%;
  padding: var(--spacing-lg);
}

.screen.active {
  display: flex;
  flex-direction: column;
  animation: screenIn 0.3s var(--ease-spring) both;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ═══════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════ */

/* Buttons */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 50px;
  background: var(--accent);
  color: var(--black);
  font: var(--headline);
  border-radius: var(--radius-full);
  transition: transform 0.1s, opacity 0.1s;
}

.btn-primary:active {
  transform: scale(0.97);
  opacity: 0.8;
}

.btn-secondary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 50px;
  background: var(--surface-2);
  color: var(--label-primary);
  font: var(--headline);
  border-radius: var(--radius-md);
  transition: transform 0.1s, opacity 0.1s;
}

.btn-secondary:active {
  transform: scale(0.97);
  opacity: 0.8;
}

.btn-text {
  font: var(--body);
  color: var(--accent);
  padding: var(--spacing-md) var(--spacing-lg);
  min-height: 44px;
}

.btn-text:active {
  opacity: 0.6;
}

/* Cards */
.card {
  background: var(--surface-1);
  border-radius: var(--radius-xl);
  padding: var(--spacing-lg);
}

/* Grouped List */
.grouped-list {
  background: var(--surface-1);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.grouped-list__item {
  display: flex;
  align-items: center;
  padding: 12px var(--spacing-md);
  border-bottom: 0.5px solid var(--separator);
  transition: background 0.15s;
  width: 100%;
  text-align: left;
}

.grouped-list__item:last-child {
  border-bottom: none;
}

.grouped-list__item:active {
  background: var(--fill-tertiary);
}

.grouped-list__icon {
  font-size: 28px;
  width: 40px;
  text-align: center;
  flex-shrink: 0;
}

.grouped-list__content {
  flex: 1;
  margin-left: 12px;
}

.grouped-list__name {
  font: var(--body);
  color: var(--label-primary);
}

.grouped-list__desc {
  font: var(--footnote);
  color: var(--label-secondary);
  margin-top: 2px;
}

.grouped-list__chevron {
  color: var(--label-quaternary);
  margin-left: 8px;
  flex-shrink: 0;
  width: 8px;
  height: 14px;
}

/* Pill */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  font: var(--footnote);
  background: var(--surface-2);
  color: var(--label-secondary);
}

/* Progress Dots */
.progress-dots {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.progress-dots__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--surface-3);
  transition: all 0.3s var(--ease-spring);
}

.progress-dots__dot.active {
  width: 10px;
  height: 10px;
  background: var(--accent);
}

.progress-dots__dot.completed {
  background: var(--accent);
}

/* ═══════════════════════════════════════════════
   SCREEN: START
   ═══════════════════════════════════════════════ */
.screen-start {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--spacing-2xl);
  position: relative;
  overflow: hidden;
}

.screen-start__glow {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
  pointer-events: none;
}

.screen-start__title {
  font: var(--large-title);
  font-size: 38px;
  line-height: 1.1;
  margin-bottom: var(--spacing-sm);
  position: relative;
}

.screen-start__subtitle {
  font: var(--subheadline);
  color: var(--label-secondary);
  margin-bottom: var(--spacing-2xl);
}

.screen-start__actions {
  width: 100%;
  max-width: 300px;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
}

/* ═══════════════════════════════════════════════
   SCREEN: MODE SELECT
   ═══════════════════════════════════════════════ */
.screen-mode {
  padding-top: var(--spacing-xl);
}

.screen-mode__header {
  font: var(--footnote);
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0 var(--spacing-md);
  margin-bottom: var(--spacing-sm);
}

/* ═══════════════════════════════════════════════
   SCREEN: ROUTE
   ═══════════════════════════════════════════════ */
.screen-route {
  padding-bottom: 100px;
}

.route-summary {
  margin-bottom: var(--spacing-lg);
}

.route-timeline {
  padding-left: 8px;
}

.route-timeline__item {
  display: flex;
  align-items: flex-start;
  position: relative;
  padding-bottom: var(--spacing-xl);
}

.route-timeline__item:last-child {
  padding-bottom: 0;
}

.route-timeline__line {
  position: absolute;
  left: 15px;
  top: 36px;
  bottom: 0;
  width: 2px;
  background: var(--surface-3);
}

.route-timeline__item:last-child .route-timeline__line {
  display: none;
}

.route-timeline__number {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font: var(--headline);
  font-size: 14px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  background: var(--surface-2);
  color: var(--label-secondary);
  border: 2px solid var(--surface-3);
  transition: all 0.3s;
}

.route-timeline__number.completed {
  background: var(--accent);
  color: var(--black);
  border-color: var(--accent);
}

.route-timeline__number.active {
  background: transparent;
  color: var(--accent);
  border-color: var(--accent);
  animation: pulseRing 2s ease-in-out infinite;
}

.route-timeline__info {
  margin-left: var(--spacing-md);
  padding-top: 4px;
}

.route-timeline__name {
  font: var(--headline);
  color: var(--label-primary);
}

.route-timeline__address {
  font: var(--footnote);
  color: var(--label-secondary);
  margin-top: 2px;
}

.route-timeline__status {
  font: var(--caption-1);
  color: var(--accent);
  margin-top: 4px;
}

.route-cta {
  position: fixed;
  bottom: calc(var(--tab-height) + var(--sab) + var(--spacing-lg));
  left: var(--spacing-lg);
  right: var(--spacing-lg);
  z-index: 50;
}

/* ═══════════════════════════════════════════════
   SCREEN: WEGAUFGABE
   ═══════════════════════════════════════════════ */
.screen-weg {
  align-items: center;
  padding-top: var(--spacing-lg);
}

.weg-progress {
  margin-bottom: var(--spacing-lg);
}

.weg-distance {
  font: var(--footnote);
  color: var(--label-secondary);
  margin-bottom: var(--spacing-xl);
  text-align: center;
}

.weg-card {
  width: 100%;
  padding: var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
}

.weg-card__badge {
  font-weight: 600;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  margin-bottom: var(--spacing-md);
  display: inline-block;
}

.weg-card__text {
  font: var(--title-2);
  color: var(--label-primary);
  line-height: 1.35;
}

.weg-card__team {
  margin-top: var(--spacing-md);
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  font: var(--footnote);
  color: var(--label-secondary);
  border-left: 3px solid var(--accent);
}

.weg-card__trink {
  margin-top: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  font: var(--footnote);
  color: var(--label-secondary);
}

.weg-card__trink::before {
  content: '\1F37A ';
}

.weg-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  margin-top: auto;
}

/* Pool: Tabu Card */
.tabu-card {
  background: var(--surface-2);
  border: 2px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-top: 16px;
  text-align: center;
}
.tabu-card__wort {
  font: var(--title-1);
  color: var(--label-primary);
}
.tabu-card__sep {
  height: 2px;
  background: var(--separator);
  margin: 12px 0;
}
.tabu-card__liste {
  list-style: none;
  padding: 0;
  margin: 0;
}
.tabu-card__liste li {
  font: var(--body);
  color: var(--label-secondary);
  padding: 6px 0;
  border-bottom: 0.5px solid var(--separator);
}
.tabu-card__liste li:last-child { border-bottom: none; }
.tabu-card__liste li::before {
  content: '\2718 ';
  color: var(--red);
  font-weight: 700;
  margin-right: 6px;
}

/* Pool: Spektrum Scale */
.spektrum-scale {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
}
.spektrum-scale__left,
.spektrum-scale__right {
  font: var(--footnote);
  font-weight: 600;
  color: var(--label-secondary);
  min-width: 60px;
}
.spektrum-scale__left { text-align: left; }
.spektrum-scale__right { text-align: right; }
.spektrum-scale__bar {
  flex: 1;
  height: 8px;
  background: linear-gradient(to right, var(--accent), var(--red));
  border-radius: 100px;
}

/* Pool: WYR Options */
.wyr-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 20px;
}
.wyr-option {
  background: var(--surface-2);
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  font: var(--title-3);
  color: var(--label-primary);
  text-align: center;
  cursor: pointer;
}
.wyr-vs {
  text-align: center;
  font: var(--footnote);
  font-weight: 700;
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ═══════════════════════════════════════════════
   SCREEN: SPAETI
   ═══════════════════════════════════════════════ */
.screen-spaeti {
  align-items: center;
  padding-top: var(--spacing-xl);
}

.spaeti-card {
  width: 100%;
  margin-bottom: var(--spacing-xl);
}

.spaeti-card__name {
  font: var(--title-1);
  margin-bottom: 4px;
}

.spaeti-card__address {
  font: var(--subheadline);
  color: var(--label-secondary);
  margin-bottom: var(--spacing-md);
}

.spaeti-card__separator {
  height: 0.5px;
  background: var(--separator);
  margin-bottom: var(--spacing-md);
}

.spaeti-card__aktion-label {
  font: var(--caption-1);
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: var(--spacing-xs);
}

.spaeti-card__aktion {
  font: var(--body);
  color: var(--label-primary);
  margin-bottom: var(--spacing-md);
}

.spaeti-card__bonus {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  background: var(--accent-dim);
  color: var(--accent);
  font: var(--caption-1);
  font-weight: 600;
}

.spaeti-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-md);
  margin-top: auto;
}

/* ═══════════════════════════════════════════════
   SCREEN: ERGEBNIS
   ═══════════════════════════════════════════════ */
.screen-ergebnis {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--spacing-2xl) var(--spacing-lg);
  background: radial-gradient(ellipse at 50% 10%, rgba(251, 191, 36, 0.15) 0%, transparent 60%);
}

.ergebnis-score {
  font-size: 48px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.ergebnis-label {
  font: var(--subheadline);
  color: var(--label-secondary);
  margin-bottom: var(--spacing-md);
}

.ergebnis-ranking {
  display: inline-flex;
  padding: 6px 16px;
  border: 1.5px solid var(--accent);
  border-radius: var(--radius-full);
  font: var(--headline);
  color: var(--accent);
  margin-bottom: var(--spacing-xl);
}

.ergebnis-breakdown {
  width: 100%;
  text-align: left;
  margin-bottom: var(--spacing-xl);
}

.ergebnis-breakdown__title {
  font: var(--footnote);
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0 var(--spacing-md);
  margin-bottom: var(--spacing-sm);
}

.ergebnis-breakdown__list {
  background: var(--surface-1);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.ergebnis-breakdown__item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px var(--spacing-md);
  border-bottom: 0.5px solid var(--separator);
}

.ergebnis-breakdown__item:last-child {
  border-bottom: none;
}

.ergebnis-breakdown__station {
  font: var(--body);
  color: var(--label-primary);
}

.ergebnis-breakdown__points {
  font: var(--headline);
  color: var(--accent);
}

.ergebnis-actions {
  width: 100%;
  max-width: 300px;
  display: flex;
  flex-direction: row;
  gap: var(--spacing-sm);
}

.ergebnis-actions .btn-primary { flex: 2; }
.ergebnis-actions .btn-secondary { flex: 1; }

/* ═══════════════════════════════════════════════
   SCREEN: SCORE TAB
   ═══════════════════════════════════════════════ */
.screen-score {
  padding-top: var(--spacing-xl);
}

.score-header {
  text-align: center;
  margin-bottom: var(--spacing-xl);
}

.score-header__value {
  font-size: 56px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.score-header__label {

/* ═══════════════════════════════════════════════
   BOTTOM SHEET
   ═══════════════════════════════════════════════ */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0, 0, 0, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.sheet-backdrop.visible {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 201;
  background: rgba(28, 28, 30, 0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: var(--spacing-sm) var(--spacing-lg) calc(var(--spacing-xl) + var(--sab));
  transform: translateY(100%);
  transition: transform 0.35s var(--ease-spring);
}

.sheet.visible {
  transform: translateY(0);
}

.sheet__handle {
  width: 36px;
  height: 5px;
  border-radius: var(--radius-full);
  background: var(--surface-3);
  margin: 0 auto var(--spacing-md);
}

.sheet__title {
  font: var(--headline);
  margin-bottom: var(--spacing-md);
}

.sheet__body {
  font: var(--body);
  color: var(--label-secondary);
  line-height: 1.5;
}

/* ═══════════════════════════════════════════════
   TIMER OVERLAY
   ═══════════════════════════════════════════════ */
.timer-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0, 0, 0, 0.95);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xl);
}

.timer-overlay.visible {
  display: flex;
}

.timer-ring {
  position: relative;
  width: 120px;
  height: 120px;
}

.timer-ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.timer-ring__bg {
  fill: none;
  stroke: var(--surface-3);
  stroke-width: 8;
}

.timer-ring__progress {
  fill: none;
  stroke: var(--accent);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}

.timer-ring__time {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font: var(--large-title);
  font-variant-numeric: tabular-nums;
  color: var(--label-primary);
}

/* ═══════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════ */
.toast {
  position: fixed;
  top: calc(var(--sat) + var(--nav-height) + var(--spacing-sm));
  left: var(--spacing-md);
  right: var(--spacing-md);
  z-index: 150;
  background: var(--surface-2);
  border-radius: var(--radius-md);
  padding: 12px var(--spacing-md);
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  font: var(--subheadline);
  color: var(--label-primary);
  transform: translateY(-20px);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.35s var(--ease-spring), opacity 0.3s;
}

.toast.visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.toast__icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}
.toast__icon svg {
  width: 100%;
  height: 100%;
}

/* ═══════════════════════════════════════════════
   POINTS FLOAT
   ═══════════════════════════════════════════════ */
.points-float {
  position: fixed;
  z-index: 160;
  font: var(--headline);
  color: var(--accent);
  pointer-events: none;
  animation: scoreFloat 1.2s var(--ease-out) forwards;
}

/* ═══════════════════════════════════════════════
   ANIMATIONS
   ═══════════════════════════════════════════════ */
@keyframes cardIn {
  from {
    transform: scale(0.95);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes pulseRing {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4);
  }
  50% {
    box-shadow: 0 0 0 8px rgba(251, 191, 36, 0);
  }
}

@keyframes scoreFloat {
  0% {
    transform: translateY(0);
    opacity: 1;
  }
  100% {
    transform: translateY(-60px);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.animate-card-in {
  animation: cardIn 0.4s var(--ease-spring) both;
}

.animate-fade-in {
  animation: fadeIn 0.3s var(--ease-out) both;
}

/* Accessibility: reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

function resolvePoolTask(task) {
  if (!task.pool) return task;
  var resolved = JSON.parse(JSON.stringify(task));
  var typ = task.pool.typ;
  var pool = POOLS[typ];
  if (!pool || pool.length === 0) return resolved;
  var idx = (poolState[typ] + Math.floor(Math.random() * (pool.length - 1))) % pool.length;
  poolState[typ] = idx + 1;
  resolved._resolved = { typ: typ, data: pool[idx] };
  return resolved;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function saveTour() {
  if (tour) localStorage.setItem(STORAGE_KEY, JSON.stringify(tour));
}

function loadTour() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    return d ? JSON.parse(d) : null;
  } catch (e) { return null; }
}

function clearTour() {
  localStorage.removeItem(STORAGE_KEY);
}

function getRanking(score) {
  return RANKINGS.find(r => score >= r.min && score <= r.max) || RANKINGS[0];
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOUR CREATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function createTour(mode) {
  // Pick STATION_COUNT spaetis using nearest-neighbor from random start
  const available = shuffle(SPAETIS);
  const selected = [available[0]];
  const remaining = available.slice(1);

  while (selected.length < STATION_COUNT && remaining.length > 0) {
    const last = selected[selected.length - 1];
    let nearestIdx = 0;
    let nearestDist = Infinity;
    for (let i = 0; i < remaining.length; i++) {
      const d = haversine(last.lat, last.lng, remaining[i].lat, remaining[i].lng);
      if (d < nearestDist) {
        nearestDist = d;
        nearestIdx = i;
      }
    }
    selected.push(remaining.splice(nearestIdx, 1)[0]);
  }

  // Filter tasks by mode
  const modeTasks = shuffle(AUFGABEN.filter(a => a.modi && a.modi.includes(mode)));

  // Slot-based assignment: assign tasks by station position (1-5)
  const wegaufgaben = [];
  const usedIds = new Set();
  let lastMechanik = null;

  for (let slot = 1; slot <= STATION_COUNT; slot++) {
    // Prefer tasks that match this slot AND have a different mechanik
    let task = null;
    for (let j = 0; j < modeTasks.length; j++) {
      const t = modeTasks[j];
      if (usedIds.has(t.id)) continue;
      if (t.slots && t.slots.includes(slot) && t.mechanik !== lastMechanik) {
        task = t;
        break;
      }
    }
    // Fallback: match slot but allow same mechanik
    if (!task) {
      for (let j = 0; j < modeTasks.length; j++) {
        const t = modeTasks[j];
        if (usedIds.has(t.id)) continue;
        if (t.slots && t.slots.includes(slot)) { task = t; break; }
      }
    }
    // Fallback: adjacent slot (+/-1)
    if (!task) {
      for (let j = 0; j < modeTasks.length; j++) {
        const t = modeTasks[j];
        if (usedIds.has(t.id)) continue;
        if (t.slots && (t.slots.includes(slot - 1) || t.slots.includes(slot + 1))) { task = t; break; }
      }
    }
    // Last resort: any unused task
    if (!task) {
      for (let j = 0; j < modeTasks.length; j++) {
        if (!usedIds.has(modeTasks[j].id)) { task = modeTasks[j]; break; }
      }
    }
    if (task) {
      usedIds.add(task.id);
      lastMechanik = task.mechanik;
      wegaufgaben.push(task);
    } else {
      wegaufgaben.push({ id: 'fallback_' + slot, text: 'Lauft weiter zur naechsten Station!', mechanik: 'activity', hint: null, punkte: 10 });
    }
  }

  // Resolve pool tasks (draw random entries from pools)
  var resolvedWeg = wegaufgaben.map(resolvePoolTask);

  return {
    mode,
    stations: selected,
    wegaufgaben: resolvedWeg,
    currentStation: 0,
    phase: 'weg',
    score: 0,
    stationScores: new Array(STATION_COUNT).fill(0),
    hintsUsed: new Array(STATION_COUNT).fill(false),
    completed: false,
    startedAt: Date.now()
  };
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const screen = document.getElementById(id);
  if (screen) screen.classList.add('active');
  currentScreen = id;
}

function setNavBar(title, opts) {
  const o = opts || {};
  const nav = document.getElementById('navBar');
  const backBtn = document.getElementById('navBack');
  const titleEl = document.getElementById('navTitle');
  const scoreEl = document.getElementById('navScore');

  nav.classList.remove('hidden');
  titleEl.textContent = title;
  backBtn.style.display = o.back ? '' : 'none';
  scoreEl.style.display = o.score ? '' : 'none';
  if (o.score && tour) scoreEl.textContent = tour.score + ' Pkt';
}

function hideNavBar() {
  document.getElementById('navBar').classList.add('hidden');
}

function showTabBar() {
  document.getElementById('tabBar').classList.remove('hidden');
}

function hideTabBar() {
  document.getElementById('tabBar').classList.add('hidden');
}

function setMainPadding(nav, tab) {
  const main = document.getElementById('mainContent');
  main.classList.toggle('with-nav', nav);
  main.classList.toggle('with-tab', tab);
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-bar__item').forEach(t => t.classList.remove('active'));

  const tabId = 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1);
  const tabEl = document.getElementById(tabId);
  if (tabEl) tabEl.classList.add('active');

  if (tab === 'tour') {
    if (tour.phase === 'weg') showWegaufgabe();
    else showSpaeti();
  } else if (tab === 'karte') {
    showRoute();
  } else if (tab === 'score') {
    showScoreTab();
  }
}

function updateScoreBadge() {
  const scoreEl = document.getElementById('navScore');
  if (scoreEl.style.display !== 'none' && tour) {
    scoreEl.textContent = tour.score + ' Pkt';
  }
}

  if (navStack.length > 0) {
    const prev = navStack.pop();
    prev();
  } else {
    showStartScreen();

  hideNavBar();
  hideTabBar();
  setMainPadding(false, false);
  showScreen('screenStart');
  stopGPS();
}

  navStack = [showStartScreen];
  setNavBar('Spielmodus', { back: true });
  hideTabBar();
  setMainPadding(true, false);
  showScreen('screenMode');
}

  tour = createTour(mode);
  saveTour();
  navStack = [];
  showRoute();
  showTabBar();
  setMainPadding(true, true);
}

function resumeTour() {
  tour = loadTour();
  if (!tour) return;
  navStack = [];
  showTabBar();
  setMainPadding(true, true);

  if (tour.completed) {
    showErgebnis();
  } else if (tour.phase === 'weg') {
    showWegaufgabe();
  } else {
    showSpaeti();
  }
}

function neueTour() {
  if (!confirm('Neue Tour starten? Der aktuelle Fortschritt geht verloren.')) return;
  clearTour();
  tour = null;
  stopGPS();
  showStartScreen();
}

function abortTour() {
  if (!confirm('Tour wirklich abbrechen?')) return;
  clearTour();
  tour = null;
  stopGPS();
  showStartScreen();
}

  const timeline = document.getElementById('routeTimeline');
  timeline.innerHTML = '';
  tour.stations.forEach(function(s, i) {
    const isCompleted = i < tour.currentStation;
    const isActive = i === tour.currentStation && !tour.completed;
    const item = document.createElement('div');
    item.className = 'route-timeline__item';

    var statusHtml = '';
    if (isActive) statusHtml = '<div class="route-timeline__status">Aktuelle Station</div>';
    else if (isCompleted) statusHtml = '<div class="route-timeline__status" style="color:var(--green)">Abgeschlossen</div>';

    item.innerHTML =
      '<div class="route-timeline__line"></div>' +
      '<div class="route-timeline__number ' + (isCompleted ? 'completed' : '') + ' ' + (isActive ? 'active' : '') + '">' + (i + 1) + '</div>' +
      '<div class="route-timeline__info">' +
        '<div class="route-timeline__name">' + s.name + '</div>' +
        '<div class="route-timeline__address">' + (s.adresse || '') + '</div>' +
        statusHtml +
      '</div>';
    timeline.appendChild(item);
  });

  // CTA
  const cta = document.getElementById('routeCta');
  if (tour.completed) {
    cta.textContent = 'Ergebnis anzeigen';
    cta.onclick = function() { showErgebnis(); };
  } else if (tour.currentStation === 0 && tour.phase === 'weg') {
    cta.textContent = 'Tour starten';
    cta.onclick = function() { switchTab('tour'); };
  } else {
    cta.textContent = 'Weiter zur Aufgabe';
    cta.onclick = function() { switchTab('tour'); };
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCREEN: WEGAUFGABE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showWegaufgabe() {
  const i = tour.currentStation;
  setNavBar('Station ' + (i + 1) + '/' + STATION_COUNT, { score: true });
  showTabBar();
  setMainPadding(true, true);
  showScreen('screenWeg');

  // Progress dots
  const dotsEl = document.getElementById('wegDots');
  dotsEl.innerHTML = '';
  for (let d = 0; d < STATION_COUNT; d++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dots__dot';
    if (d === i) dot.classList.add('active');
    else if (d < i) dot.classList.add('completed');
    dotsEl.appendChild(dot);
  }

  // Task card
  const task = tour.wegaufgaben[i];
  const badge = document.getElementById('wegBadge');
  const mechanik = task.mechanik || 'activity';
  const MECH_LABELS = { 'matze': 'Hotel Matze', 'just-one': 'Just One', 'activity': 'Activity', 'wer-bin-ich': 'Wer bin ich', 'challenge': 'Challenge', 'ranking': 'Ranking', 'stadt': 'Stadtmission' };
  const color = MECHANIK_COLORS[mechanik] || '#fbbf24';
  badge.textContent = MECH_LABELS[mechanik] || mechanik;
  badge.style.background = color + '22';
  badge.style.color = color;

  document.getElementById('wegText').textContent = task.text || '';

  // Team-Modus display
  const teamEl = document.getElementById('wegTeam');
  if (task.meta && task.meta.team_modus) {
    teamEl.textContent = 'Teilt euch: ' + task.meta.team_modus;
    teamEl.style.display = 'block';
  } else {
    teamEl.style.display = 'none';
  }

  // Trinkregel display
  const trinkEl = document.getElementById('wegTrink');
  if (task.meta && task.meta.trink_regel) {
    trinkEl.textContent = task.meta.trink_regel;
    trinkEl.style.display = 'block';
  } else {
    trinkEl.style.display = 'none';
  }

  // Pool displays
  document.getElementById('wegTabu').style.display = 'none';
  document.getElementById('wegSpektrum').style.display = 'none';
  document.getElementById('wegWyr').style.display = 'none';

  if (task._resolved) {
    var r = task._resolved;
    if (r.typ === 'tabu') {
      document.getElementById('wegTabu').style.display = 'block';
      document.getElementById('wegTabuWort').textContent = r.data.wort;
      var ul = document.getElementById('wegTabuListe');
      ul.innerHTML = '';
      r.data.verboten.forEach(function(w) {
        var li = document.createElement('li');
        li.textContent = w;
        ul.appendChild(li);
      });
    }
    if (r.typ === 'spektrum') {
      document.getElementById('wegSpektrum').style.display = 'block';
      document.getElementById('wegSpektrumLeft').textContent = r.data[0];
      document.getElementById('wegSpektrumRight').textContent = r.data[1];
    }
    if (r.typ === 'wyr') {
      document.getElementById('wegWyr').style.display = 'block';
      document.getElementById('wegWyrA').textContent = r.data[0];
      document.getElementById('wegWyrB').textContent = r.data[1];
    }
  }

  // Non-pool tabu_woerter display
  if (!task._resolved && task.meta && task.meta.tabu_woerter && task.meta.tabu_woerter.length > 0) {
    document.getElementById('wegTabu').style.display = 'block';
    var tabuWort = (task.text.match(/'([^']+)'/) || [])[1] || 'Begriff';
    document.getElementById('wegTabuWort').textContent = tabuWort;
    var ul = document.getElementById('wegTabuListe');
    ul.innerHTML = '';
    task.meta.tabu_woerter.forEach(function(w) {
      var li = document.createElement('li');
      li.textContent = w;
      ul.appendChild(li);
    });
  }

  // Re-trigger card animation
  const card = document.getElementById('wegCard');
  card.classList.remove('animate-card-in');
  void card.offsetWidth;
  card.classList.add('animate-card-in');

  // Timer auto-start
  cancelTimer();
  if (task.meta && task.meta.timer_sek && task.meta.timer_sek >= 5) {
    startTimer(task.meta.timer_sek, null);
  }

  // Start GPS tracking
  startGPS();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCREEN: SPAETI
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showSpaeti() {
  const i = tour.currentStation;
  const station = tour.stations[i];
  setNavBar(station.name, { score: true });
  showTabBar();
  setMainPadding(true, true);
  showScreen('screenSpaeti');

  document.getElementById('spaetiName').textContent = station.name;
  document.getElementById('spaetiAddress').textContent = station.adresse || '';
  const aktion = station.aktion || {};
  document.getElementById('spaetiAktion').textContent = aktion.beschreibung || aktion.name || 'Kauft euch ein Getraenk!';
  const bonus = aktion.bonuspunkte || PTS_STATION;
  document.getElementById('spaetiBonus').textContent = '+' + bonus + ' Punkte';

  // Re-trigger card animation
  const card = document.getElementById('spaetiCard');
  card.classList.remove('animate-card-in');
  void card.offsetWidth;
  card.classList.add('animate-card-in');

  showToast('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>', 'Willkommen bei ' + station.name + '!');
  stopGPS();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCREEN: ERGEBNIS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showErgebnis() {
  hideNavBar();
  hideTabBar();
  setMainPadding(false, false);
  showScreen('screenErgebnis');
  stopGPS();

  // Count-up animation (2s, ease-out)
  const scoreEl = document.getElementById('ergebnisScore');
  const target = tour.score;
  const duration = 2000;
  const start = performance.now();
  function animateScore(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    scoreEl.textContent = Math.round(target * eased);
    if (progress < 1) requestAnimationFrame(animateScore);
  }
  requestAnimationFrame(animateScore);

  document.getElementById('ergebnisRankingLabel').textContent = getRanking(tour.score).label;

  // Breakdown
  const breakdown = document.getElementById('ergebnisBreakdown');
  var listHtml = '';
  tour.stations.forEach(function(s, i) {
    const hintPenalty = tour.hintsUsed[i] ? ' <span style="color:var(--red)">(-' + PTS_HINT + ')</span>' : '';
    listHtml += '<div class="ergebnis-breakdown__item">' +
      '<span class="ergebnis-breakdown__station">' + s.name + '</span>' +
      '<span class="ergebnis-breakdown__points">+' + tour.stationScores[i] + hintPenalty + '</span>' +
    '</div>';
  });
  breakdown.innerHTML =
    '<p class="ergebnis-breakdown__title">Punkteverteilung</p>' +
    '<div class="ergebnis-breakdown__list">' + listHtml + '</div>';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCREEN: SCORE TAB
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showScoreTab() {
  setNavBar('Score', { score: false });
  showTabBar();
  setMainPadding(true, true);
  showScreen('screenScoreTab');

  document.getElementById('scoreTabValue').textContent = tour.score;

  const breakdown = document.getElementById('scoreTabBreakdown');
  var listHtml = '';
  tour.stations.forEach(function(s, i) {
    var name = (i < tour.currentStation || tour.stationScores[i] > 0) ? s.name : '???';
    var pts = tour.stationScores[i] > 0 ? ('+' + tour.stationScores[i]) : '\u2013';
    listHtml += '<div class="ergebnis-breakdown__item">' +
      '<span class="ergebnis-breakdown__station">' + name + '</span>' +
      '<span class="ergebnis-breakdown__points">' + pts + '</span>' +
    '</div>';
  });
  breakdown.innerHTML =
    '<p class="ergebnis-breakdown__title">Bisherige Punkte</p>' +
    '<div class="ergebnis-breakdown__list">' + listHtml + '</div>';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ACTIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function wegErledigt() {
  cancelTimer();
  const i = tour.currentStation;
  const task = tour.wegaufgaben[i];
  const basePts = task.punkte || PTS_STATION;
  const pts = tour.hintsUsed[i] ? Math.max(basePts - PTS_HINT, 5) : basePts;
  tour.stationScores[i] += pts;
  tour.score += pts;
  tour.phase = 'spaeti';
  saveTour();
  floatPoints(pts);
  if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
  showSpaeti();
}

function wegSkip() {
  cancelTimer();
  tour.phase = 'spaeti';
  saveTour();
  showSpaeti();
}

function showHintSheet() {
  const task = tour.wegaufgaben[tour.currentStation];
  const hint = task.hint || 'Kein Hinweis verfuegbar.';
  tour.hintsUsed[tour.currentStation] = true;
  saveTour();
  openSheet('Hinweis', hint);
}

function spaetiAktion() {
  const i = tour.currentStation;
  const station = tour.stations[i];
  const bonus = (station.aktion && station.aktion.bonuspunkte) || PTS_STATION;
  tour.stationScores[i] += bonus;
  tour.score += bonus;
  floatPoints(bonus);
  if (navigator.vibrate) navigator.vibrate(200);
  advanceStation();
}

function spaetiWeiter() {
  advanceStation();
}

function advanceStation() {
  tour.currentStation++;
  if (tour.currentStation >= STATION_COUNT) {
    tour.completed = true;
    saveTour();
    showErgebnis();
  } else {
    tour.phase = 'weg';
    saveTour();
    showWegaufgabe();
  }
}

function routeCtaAction() {
  if (tour.completed) {
    showErgebnis();
  } else {
    switchTab('tour');
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// GPS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function startGPS() {
  stopGPS();
  gpsArrived = false;
  gpsWegStart = Date.now();
  if (!navigator.geolocation) {
    document.getElementById('wegDistance').textContent = 'GPS nicht verfuegbar';
    return;
  }

  gpsWatchId = navigator.geolocation.watchPosition(
    function(pos) {
      if (!tour || tour.phase !== 'weg') return;
      const target = tour.stations[tour.currentStation];
      const dist = haversine(pos.coords.latitude, pos.coords.longitude, target.lat, target.lng);
      const distEl = document.getElementById('wegDistance');

      if (dist < 1000) {
        distEl.textContent = 'noch ~' + Math.round(dist) + 'm';
      } else {
        distEl.textContent = 'noch ~' + (dist / 1000).toFixed(1) + ' km';
      }

      // Guard: ignore if already arrived, or if weg screen open less than 10s
      if (dist <= GPS_THRESHOLD && !gpsArrived && (Date.now() - gpsWegStart > 10000)) {
        gpsArrived = true;
        if (navigator.vibrate) navigator.vibrate(200);
        showToast('<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>', 'Ihr seid da!');
        setTimeout(function() {
          if (tour && tour.phase === 'weg') {
            cancelTimer();
            tour.phase = 'spaeti';
            saveTour();
            showSpaeti();
          }
        }, 1500);
      }
    },
    function(err) {
      var target = tour.stations[tour.currentStation];
      var el = document.getElementById('wegDistance');
      el.innerHTML = '<a href="https://maps.apple.com/?daddr=' + target.lat + ',' + target.lng + '&dirflg=w" target="_blank" style="color:var(--accent)">In Maps navigieren &#x2192;</a>';
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
  );
}

function stopGPS() {
  if (gpsWatchId !== null) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BOTTOM SHEET
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openSheet(title, body) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').textContent = body;
  document.getElementById('sheetBackdrop').classList.add('visible');
  document.getElementById('sheet').classList.add('visible');
}

function closeSheet() {
  document.getElementById('sheetBackdrop').classList.remove('visible');
  document.getElementById('sheet').classList.remove('visible');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TIMER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function startTimer(seconds, cb) {
  timerCallback = cb;
  var remaining = seconds;
  const circumference = 2 * Math.PI * 52;
  const progress = document.getElementById('timerProgress');
  const timeDisplay = document.getElementById('timerTime');
  const overlay = document.getElementById('timerOverlay');

  progress.style.strokeDasharray = circumference;
  progress.style.strokeDashoffset = '0';
  progress.style.stroke = 'var(--accent)';
  timeDisplay.style.color = 'var(--label-primary)';
  timeDisplay.textContent = remaining;
  overlay.classList.add('visible');

  timerInterval = setInterval(function() {
    remaining--;
    timeDisplay.textContent = remaining;
    const offset = circumference * (1 - remaining / seconds);
    progress.style.strokeDashoffset = offset;

    if (remaining <= 5) {
      progress.style.stroke = 'var(--red)';
      timeDisplay.style.color = 'var(--red)';
    }

    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      if (navigator.vibrate) navigator.vibrate(500);
      setTimeout(function() {
        overlay.classList.remove('visible');
        if (timerCallback) timerCallback();
      }, 1000);
    }
  }, 1000);
}

function cancelTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  document.getElementById('timerOverlay').classList.remove('visible');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let toastTimeout = null;

function showToast(icon, text) {
  const toast = document.getElementById('toast');
  document.getElementById('toastIcon').innerHTML = icon;
  document.getElementById('toastText').textContent = text;
  toast.classList.add('visible');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(function() {
    toast.classList.remove('visible');
    toastTimeout = null;
  }, 3000);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// POINTS FLOAT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function floatPoints(pts) {
  const el = document.createElement('div');
  el.className = 'points-float';
  el.textContent = '+' + pts;
  el.style.top = '80px';
  el.style.right = '20px';
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 1200);
  updateScoreBadge();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SHARE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function shareTour() {
  const text = 'Sp\u00e4titour Leipzig: ' + tour.score + ' Punkte! ' + getRanking(tour.score).label + ' \uD83C\uDF1F';
  if (navigator.share) {
    navigator.share({ title: 'Sp\u00e4titour Leipzig', text: text });
  } else {
    navigator.clipboard.writeText(text).then(function() {
      showToast('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>', 'In Zwischenablage kopiert!');
    });
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
(function init() {
  const saved = loadTour();
  if (saved) {
    document.getElementById('btnResume').style.display = '';
  }
  showScreen('screenStart');
})();
</script>
