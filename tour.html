<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sp&auml;titour Leipzig</title>
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════ */
:root {
  /* Colors */
  --black: #000000;
  --surface-0: #000000;
  --surface-1: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --separator: rgba(84, 84, 88, 0.65);
  --separator-opaque: #38383a;
  --label-primary: #ffffff;
  --label-secondary: rgba(235, 235, 245, 0.6);
  --label-tertiary: rgba(235, 235, 245, 0.3);
  --label-quaternary: rgba(235, 235, 245, 0.18);
  --accent: #fbbf24;
  --accent-dim: rgba(251, 191, 36, 0.15);
  --red: #ff453a;
  --green: #30d158;
  --blue: #0a84ff;
  --fill-primary: rgba(120, 120, 128, 0.36);
  --fill-secondary: rgba(120, 120, 128, 0.32);
  --fill-tertiary: rgba(120, 120, 128, 0.24);

  /* Mechanik badge colors */
  --mechanik-matze: #c4b5fd;
  --mechanik-just-one: #67e8f9;
  --mechanik-activity: #fca5a5;
  --mechanik-wer-bin-ich: #fdba74;
  --mechanik-challenge: #fbbf24;
  --mechanik-ranking: #86efac;
  --mechanik-stadt: #a5b4fc;

  /* Typography */
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
  --large-title: 700 34px/41px var(--font);
  --title-1: 700 28px/34px var(--font);
  --title-2: 700 22px/28px var(--font);
  --title-3: 600 20px/25px var(--font);
  --headline: 600 17px/22px var(--font);
  --body: 400 17px/22px var(--font);
  --callout: 400 16px/21px var(--font);
  --subheadline: 400 15px/20px var(--font);
  --footnote: 400 13px/18px var(--font);
  --caption-1: 400 12px/16px var(--font);
  --caption-2: 400 11px/13px var(--font);

  /* Spacing */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 20px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;

  /* Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Safe areas */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);

  /* Shell heights */
  --nav-height: 44px;
  --tab-height: 49px;

  /* Easing */
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ═══════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--black);
  color: var(--label-primary);
  font: var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-appearance: none;
}

button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ═══════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════ */

/* Nav Bar */
.nav-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: calc(var(--nav-height) + var(--sat));
  padding-top: var(--sat);
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--separator);
  transition: transform 0.3s var(--ease-out), opacity 0.3s var(--ease-out);
}

.nav-bar.hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}

.nav-bar__back {
  position: absolute;
  left: var(--spacing-md);
  display: flex;
  align-items: center;
  gap: 4px;
  font: var(--body);
  color: var(--accent);
}

.nav-bar__back svg {
  width: 12px;
  height: 20px;
}

.nav-bar__title {
  font: var(--headline);
  color: var(--label-primary);
  text-align: center;
  max-width: 60%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-bar__score {
  position: absolute;
  right: var(--spacing-md);
  display: flex;
  align-items: center;
  gap: 4px;
  font: var(--headline);
  color: var(--accent);
}

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: calc(var(--tab-height) + var(--sab));
  padding-bottom: var(--sab);
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--separator);
  transition: transform 0.3s var(--ease-out), opacity 0.3s var(--ease-out);
}

.tab-bar.hidden {
  transform: translateY(100%);
  opacity: 0;
  pointer-events: none;
}

.tab-bar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding-top: 6px;
  min-width: 64px;
  color: var(--label-secondary);
  transition: color 0.2s;
}

.tab-bar__item.active {
  color: var(--accent);
}

.tab-bar__item svg {
  width: 24px;
  height: 24px;
}

.tab-bar__item span {
  font: var(--caption-2);
}

/* Main Content */
.main {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  transition: padding 0.3s var(--ease-out);
}

.main.with-nav {
  padding-top: calc(var(--nav-height) + var(--sat));
}

.main.with-tab {
  padding-bottom: calc(var(--tab-height) + var(--sab));
}

/* Screens */
.screen {
  display: none;
  min-height: 100%;
  padding: var(--spacing-lg);
}

.screen.active {
  display: flex;
  flex-direction: column;
  animation: screenIn 0.3s var(--ease-spring) both;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ═══════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════ */

/* Buttons */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 50px;
  background: var(--accent);
  color: var(--black);
  font: var(--headline);
  border-radius: var(--radius-full);
  transition: transform 0.1s, opacity 0.1s;
}

.btn-primary:active {
  transform: scale(0.97);
  opacity: 0.8;
}

.btn-secondary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 50px;
  background: var(--surface-2);
  color: var(--label-primary);
  font: var(--headline);
  border-radius: var(--radius-md);
  transition: transform 0.1s, opacity 0.1s;
}

.btn-secondary:active {
  transform: scale(0.97);
  opacity: 0.8;
}

.btn-text {
  font: var(--body);
  color: var(--accent);
  padding: var(--spacing-md) var(--spacing-lg);
  min-height: 44px;
}

.btn-text:active {
  opacity: 0.6;
}

/* Cards */
.card {
  background: var(--surface-1);
  border-radius: var(--radius-xl);
  padding: var(--spacing-lg);
}

/* Grouped List */
.grouped-list {
  background: var(--surface-1);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.grouped-list__item {
  display: flex;
  align-items: center;
  padding: 12px var(--spacing-md);
  border-bottom: 0.5px solid var(--separator);
  transition: background 0.15s;
  width: 100%;
  text-align: left;
}

.grouped-list__item:last-child {
  border-bottom: none;
}

.grouped-list__item:active {
  background: var(--fill-tertiary);
}

.grouped-list__icon {
  font-size: 28px;
  width: 40px;
  text-align: center;
  flex-shrink: 0;
}

.grouped-list__content {
  flex: 1;
  margin-left: 12px;
}

.grouped-list__name {
  font: var(--body);
  color: var(--label-primary);
}

.grouped-list__desc {
  font: var(--footnote);
  color: var(--label-secondary);
  margin-top: 2px;
}

.grouped-list__chevron {
  color: var(--label-quaternary);
  margin-left: 8px;
  flex-shrink: 0;
  width: 8px;
  height: 14px;
}

/* Pill */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  font: var(--footnote);
  background: var(--surface-2);
  color: var(--label-secondary);
}

/* Progress Dots */
.progress-dots {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.progress-dots__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--surface-3);
  transition: all 0.3s var(--ease-spring);
}

.progress-dots__dot.active {
  width: 10px;
  height: 10px;
  background: var(--accent);
}

.progress-dots__dot.completed {
  background: var(--accent);
}

/* ═══════════════════════════════════════════════
   SCREEN: START
   ═══════════════════════════════════════════════ */
.screen-start {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--spacing-2xl);
  position: relative;
  overflow: hidden;
}

.screen-start__glow {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
  pointer-events: none;
}

.screen-start__title {
  font: var(--large-title);
  font-size: 38px;
  line-height: 1.1;
  margin-bottom: var(--spacing-sm);
  position: relative;
}

.screen-start__subtitle {
  font: var(--subheadline);
  color: var(--label-secondary);
  margin-bottom: var(--spacing-2xl);
}

.screen-start__actions {
  width: 100%;
  max-width: 300px;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-md);
}

/* ═══════════════════════════════════════════════
   SCREEN: MODE SELECT
   ═══════════════════════════════════════════════ */
.screen-mode {
  padding-top: var(--spacing-xl);
}

.screen-mode__header {
  font: var(--footnote);
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0 var(--spacing-md);
  margin-bottom: var(--spacing-sm);
}

/* ═══════════════════════════════════════════════
   SCREEN: ROUTE
   ═══════════════════════════════════════════════ */
.screen-route {
  padding-bottom: 100px;
}

.route-summary {
  margin-bottom: var(--spacing-lg);
}

.route-timeline {
  padding-left: 8px;
}

.route-timeline__item {
  display: flex;
  align-items: flex-start;
  position: relative;
  padding-bottom: var(--spacing-xl);
}

.route-timeline__item:last-child {
  padding-bottom: 0;
}

.route-timeline__line {
  position: absolute;
  left: 15px;
  top: 36px;
  bottom: 0;
  width: 2px;
  background: var(--surface-3);
}

.route-timeline__item:last-child .route-timeline__line {
  display: none;
}

.route-timeline__number {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font: var(--headline);
  font-size: 14px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  background: var(--surface-2);
  color: var(--label-secondary);
  border: 2px solid var(--surface-3);
  transition: all 0.3s;
}

.route-timeline__number.completed {
  background: var(--accent);
  color: var(--black);
  border-color: var(--accent);
}

.route-timeline__number.active {
  background: transparent;
  color: var(--accent);
  border-color: var(--accent);
  animation: pulseRing 2s ease-in-out infinite;
}

.route-timeline__info {
  margin-left: var(--spacing-md);
  padding-top: 4px;
}

.route-timeline__name {
  font: var(--headline);
  color: var(--label-primary);
}

.route-timeline__address {
  font: var(--footnote);
  color: var(--label-secondary);
  margin-top: 2px;
}

.route-timeline__phase {
  font: var(--caption-1);
  color: var(--label-tertiary);
  margin-top: 2px;
}

.route-timeline__status {
  font: var(--caption-1);
  color: var(--accent);
  margin-top: 4px;
}

.route-cta {
  position: fixed;
  bottom: calc(var(--tab-height) + var(--sab) + var(--spacing-lg));
  left: var(--spacing-lg);
  right: var(--spacing-lg);
  z-index: 50;
}

/* ═══════════════════════════════════════════════
   SCREEN: WEGAUFGABE
   ═══════════════════════════════════════════════ */
.screen-weg {
  align-items: center;
  padding-top: var(--spacing-lg);
}

.weg-progress {
  margin-bottom: var(--spacing-lg);
}

.weg-distance {
  font: var(--footnote);
  color: var(--label-secondary);
  margin-bottom: var(--spacing-xl);
  text-align: center;
}

.weg-card {
  width: 100%;
  padding: var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
}

.weg-card__badge {
  font-weight: 600;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  margin-bottom: var(--spacing-md);
  display: inline-block;
}

.weg-card__text {
  font: var(--title-2);
  color: var(--label-primary);
  line-height: 1.35;
}

.weg-card__team {
  margin-top: var(--spacing-md);
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  font: var(--footnote);
  color: var(--label-secondary);
  border-left: 3px solid var(--accent);
}

.weg-card__trink {
  margin-top: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-md);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  font: var(--footnote);
  color: var(--label-secondary);
}

.weg-card__trink::before {
  content: '\1F37A ';
}

.weg-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  margin-top: auto;
}

/* Pool: Tabu Card */
.tabu-card {
  background: var(--surface-2);
  border: 2px solid var(--accent);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-top: 16px;
  text-align: center;
}
.tabu-card__wort {
  font: var(--title-1);
  color: var(--label-primary);
}
.tabu-card__sep {
  height: 2px;
  background: var(--separator);
  margin: 12px 0;
}
.tabu-card__liste {
  list-style: none;
  padding: 0;
  margin: 0;
}
.tabu-card__liste li {
  font: var(--body);
  color: var(--label-secondary);
  padding: 6px 0;
  border-bottom: 0.5px solid var(--separator);
}
.tabu-card__liste li:last-child { border-bottom: none; }
.tabu-card__liste li::before {
  content: '\2718 ';
  color: var(--red);
  font-weight: 700;
  margin-right: 6px;
}

/* Pool: Spektrum Scale */
.spektrum-scale {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
}
.spektrum-scale__left,
.spektrum-scale__right {
  font: var(--footnote);
  font-weight: 600;
  color: var(--label-secondary);
  min-width: 60px;
}
.spektrum-scale__left { text-align: left; }
.spektrum-scale__right { text-align: right; }
.spektrum-scale__bar {
  flex: 1;
  height: 8px;
  background: linear-gradient(to right, var(--accent), var(--red));
  border-radius: 100px;
}

/* Pool: WYR Options */
.wyr-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 20px;
}
.wyr-option {
  background: var(--surface-2);
  border: 1px solid var(--separator);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  font: var(--title-3);
  color: var(--label-primary);
  text-align: center;
  cursor: pointer;
}
.wyr-vs {
  text-align: center;
  font: var(--footnote);
  font-weight: 700;
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ═══════════════════════════════════════════════
   SCREEN: ORT-AUFGABE
   ═══════════════════════════════════════════════ */
.screen-ort {
  align-items: center;
  padding-top: var(--spacing-lg);
}

.ort-station-label {
  font: var(--footnote);
  color: var(--label-tertiary);
  margin-bottom: var(--spacing-md);
  text-align: center;
}

.ort-card {
  width: 100%;
  padding: var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
}

.ort-card__badge {
  font-weight: 600;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  margin-bottom: var(--spacing-md);
  display: inline-block;
}

.ort-card__text {
  font: var(--title-2);
  color: var(--label-primary);
  line-height: 1.35;
}

.ort-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  margin-top: auto;
}

/* ═══════════════════════════════════════════════
   SCREEN: BONUS
   ═══════════════════════════════════════════════ */
.screen-bonus {
  align-items: center;
  justify-content: center;
}

.bonus-card {
  width: 100%;
  padding: var(--spacing-lg);
  text-align: center;
  margin-bottom: var(--spacing-xl);
}

.bonus-card__label {
  font: var(--footnote);
  color: var(--label-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: var(--spacing-sm);
}

.bonus-card__name {
  font: var(--title-1);
  color: var(--label-primary);
  margin: 0 0 var(--spacing-md) 0;
}

.bonus-card__desc {
  font: var(--body);
  color: var(--label-secondary);
  margin: 0 0 var(--spacing-lg) 0;
}

.bonus-card__points {
  font: var(--headline);
  color: var(--accent);
}

.bonus-actions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  margin-top: auto;
}

/* ═══════════════════════════════════════════════
   SCREEN: ERGEBNIS
   ═══════════════════════════════════════════════ */
.screen-ergebnis {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--spacing-2xl) var(--spacing-lg);
  background: radial-gradient(ellipse at 50% 10%, rgba(251, 191, 36, 0.15) 0%, transparent 60%);
}

.ergebnis-score {
  font-size: 48px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.ergebnis-label {
  font: var(--subheadline);
  color: var(--label-secondary);
  margin-bottom: var(--spacing-md);
}

.ergebnis-ranking {
  display: inline-flex;
  padding: 6px 16px;
  border: 1.5px solid var(--accent);
  border-radius: var(--radius-full);
  font: var(--headline);
  color: var(--accent);
  margin-bottom: var(--spacing-xl);
}

.ergebnis-breakdown {
  width: 100%;
  text-align: left;
  margin-bottom: var(--spacing-xl);
}

.ergebnis-breakdown__title {
  font: var(--footnote);
  color: var(--label-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 0 var(--spacing-md);
  margin-bottom: var(--spacing-sm);
}

.ergebnis-breakdown__list {
  background: var(--surface-1);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.ergebnis-breakdown__item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px var(--spacing-md);
  border-bottom: 0.5px solid var(--separator);
}

.ergebnis-breakdown__item:last-child {
  border-bottom: none;
}

.ergebnis-breakdown__station {
  font: var(--body);
  color: var(--label-primary);
}

.ergebnis-breakdown__points {
  font: var(--headline);
  color: var(--accent);
}

.ergebnis-actions {
  width: 100%;
  max-width: 300px;
  display: flex;
  flex-direction: row;
  gap: var(--spacing-sm);
}

.ergebnis-actions .btn-primary { flex: 2; }
.ergebnis-actions .btn-secondary { flex: 1; }

/* ═══════════════════════════════════════════════
   SCREEN: SCORE TAB
   ═══════════════════════════════════════════════ */
.screen-score {
  padding-top: var(--spacing-xl);
}

.score-header {
  text-align: center;
  margin-bottom: var(--spacing-xl);
}

.score-header__value {
  font-size: 56px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.score-header__label {
  font: var(--subheadline);
  color: var(--label-secondary);
}

/* ═══════════════════════════════════════════════
   BOTTOM SHEET
   ═══════════════════════════════════════════════ */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0, 0, 0, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.sheet-backdrop.visible {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 201;
  background: rgba(28, 28, 30, 0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: var(--spacing-sm) var(--spacing-lg) calc(var(--spacing-xl) + var(--sab));
  transform: translateY(100%);
  transition: transform 0.35s var(--ease-spring);
}

.sheet.visible {
  transform: translateY(0);
}

.sheet__handle {
  width: 36px;
  height: 5px;
  border-radius: var(--radius-full);
  background: var(--surface-3);
  margin: 0 auto var(--spacing-md);
}

.sheet__title {
  font: var(--headline);
  margin-bottom: var(--spacing-md);
}

.sheet__body {
  font: var(--body);
  color: var(--label-secondary);
  line-height: 1.5;
}

.sheet__actions {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-sm);
  margin-top: var(--spacing-lg);
  width: 100%;
}

/* ═══════════════════════════════════════════════
   TIMER OVERLAY
   ═══════════════════════════════════════════════ */
.timer-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0, 0, 0, 0.95);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xl);
}

.timer-overlay.visible {
  display: flex;
}

.timer-ring {
  position: relative;
  width: 120px;
  height: 120px;
}

.timer-ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.timer-ring__bg {
  fill: none;
  stroke: var(--surface-3);
  stroke-width: 8;
}

.timer-ring__progress {
  fill: none;
  stroke: var(--accent);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}

.timer-ring__time {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font: var(--large-title);
  font-variant-numeric: tabular-nums;
  color: var(--label-primary);
}

/* ═══════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════ */
.toast {
  position: fixed;
  top: calc(var(--sat) + var(--nav-height) + var(--spacing-sm));
  left: var(--spacing-md);
  right: var(--spacing-md);
  z-index: 150;
  background: var(--surface-2);
  border-radius: var(--radius-md);
  padding: 12px var(--spacing-md);
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  font: var(--subheadline);
  color: var(--label-primary);
  transform: translateY(-20px);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.35s var(--ease-spring), opacity 0.3s;
}

.toast.visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.toast__icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}
.toast__icon svg {
  width: 100%;
  height: 100%;
}

/* ═══════════════════════════════════════════════
   POINTS FLOAT
   ═══════════════════════════════════════════════ */
.points-float {
  position: fixed;
  z-index: 160;
  font: var(--headline);
  color: var(--accent);
  pointer-events: none;
  animation: scoreFloat 1.2s var(--ease-out) forwards;
}

/* ═══════════════════════════════════════════════
   ANIMATIONS
   ═══════════════════════════════════════════════ */
@keyframes cardIn {
  from {
    transform: scale(0.95);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes pulseRing {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4);
  }
  50% {
    box-shadow: 0 0 0 8px rgba(251, 191, 36, 0);
  }
}

@keyframes scoreFloat {
  0% {
    transform: translateY(0);
    opacity: 1;
  }
  100% {
    transform: translateY(-60px);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.animate-card-in {
  animation: cardIn 0.4s var(--ease-spring) both;
}

.animate-fade-in {
  animation: fadeIn 0.3s var(--ease-out) both;
}

/* Desktop: phone-width container */
@media (min-width: 480px) {
  .nav-bar,
  .main,
  .tab-bar,
  .sheet,
  .timer-overlay {
    max-width: 430px;
    margin-left: auto;
    margin-right: auto;
  }
  .main {
    border-left: 0.5px solid var(--separator);
    border-right: 0.5px solid var(--separator);
  }
  .toast {
    max-width: calc(430px - 2 * var(--spacing-md));
    margin-left: auto;
    margin-right: auto;
  }
}

/* Accessibility: reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
